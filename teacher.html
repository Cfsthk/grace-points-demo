<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#164f42" />
    <meta
      name="description"
      content="Grace Points teacher reward and administration portal demo."
    />
    <title>Teacher Portal · Grace Points</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=3" />
  </head>
  <body data-page="teacher">
    <div class="app-shell">
      <header class="topbar page-topbar">
        <a class="brand" href="teacher.html" aria-label="Grace Points teacher home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 40 40" role="img">
              <path d="M21 8c2.4-4.1 5.7-5.7 9.8-4.8C28.9 7 25.6 8.7 21 8Z" />
              <path d="M20.1 10.4C11.7 6 4.6 12 6.2 21c1.5 8.1 7.6 15 13.8 15s12.3-6.9 13.8-15c1.6-9-5.5-15-13.7-10.6Z" />
              <circle cx="15" cy="18" r="2.2" />
            </svg>
          </span>
          <span class="brand-copy">
            <strong>Grace Points</strong>
            <small data-i18n="teacherPortal">Teacher portal</small>
          </span>
        </a>

        <div class="topbar-actions">
          <a class="portal-link subtle-link" href="index.html" data-i18n="studentPage">Student page</a>
          <button class="portal-link" id="admin-entry-button" type="button" data-i18n="adminPortal">Admin portal</button>
          <button class="portal-link" id="back-to-teacher-button" type="button" data-i18n="teacherWorkspace" hidden>Teacher workspace</button>
          <button class="language-button" id="language-toggle" type="button" aria-label="Switch language">中文</button>
          <div class="account-identity" id="account-identity" aria-live="polite">
            <span class="avatar">陳</span>
            <span class="account-name">Ms Chan</span>
          </div>
        </div>
      </header>

      <main id="main-content" tabindex="-1"></main>
    </div>

    <div id="modal-root"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <noscript>This demo needs JavaScript enabled.</noscript>
    <script src="app.js?v=3" defer></script>
  </body>
</html>
